<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620"
     font-family="Inter, Segoe UI, sans-serif">
  <rect width="900" height="620" fill="#0b0f1a"/>

  <!-- UI layer -->
  <rect x="40" y="40" width="820" height="90" rx="12" fill="#141b2e" stroke="#24304b"/>
  <text x="450" y="78" text-anchor="middle" fill="#e5ecff" font-size="16" font-weight="700">UI · JavaFX Application Thread</text>
  <text x="450" y="102" text-anchor="middle" fill="#8b9ac0" font-size="12">MainWindow · Sidebar · TopBar · Pages · Palette · Notifications</text>

  <!-- AppContext -->
  <rect x="300" y="160" width="300" height="60" rx="10" fill="#1a2545" stroke="#5b8cff"/>
  <text x="450" y="196" text-anchor="middle" fill="#e5ecff" font-size="14" font-weight="700">AppContext</text>

  <!-- Engine + DB row -->
  <rect x="80"  y="260" width="360" height="80" rx="10" fill="#141b2e" stroke="#24304b"/>
  <text x="260" y="292" text-anchor="middle" fill="#e5ecff" font-size="14" font-weight="700">LearningEngine (virtual thread)</text>
  <text x="260" y="316" text-anchor="middle" fill="#8b9ac0" font-size="11">Extractor · GapDetector · QuestionGen · Contradiction</text>

  <rect x="460" y="260" width="360" height="80" rx="10" fill="#141b2e" stroke="#24304b"/>
  <text x="640" y="292" text-anchor="middle" fill="#e5ecff" font-size="14" font-weight="700">Database · SQLite</text>
  <text x="640" y="316" text-anchor="middle" fill="#8b9ac0" font-size="11">prepared statements · 10 tables</text>

  <!-- Provider row -->
  <rect x="80"  y="380" width="360" height="70" rx="10" fill="#101728" stroke="#3f6dff"/>
  <text x="260" y="410" text-anchor="middle" fill="#8ab4ff" font-size="13" font-weight="700">AIProvider</text>
  <text x="260" y="432" text-anchor="middle" fill="#8b9ac0" font-size="11">OpenAI-compatible · Custom · Local</text>

  <rect x="460" y="380" width="360" height="70" rx="10" fill="#101728" stroke="#3f6dff"/>
  <text x="640" y="410" text-anchor="middle" fill="#8ab4ff" font-size="13" font-weight="700">SearchProvider</text>
  <text x="640" y="432" text-anchor="middle" fill="#8b9ac0" font-size="11">DuckDuckGo · Custom</text>

  <!-- External -->
  <rect x="270" y="500" width="360" height="70" rx="10" fill="#0d1220" stroke="#5b8cff" stroke-dasharray="4 4"/>
  <text x="450" y="532" text-anchor="middle" fill="#e5ecff" font-size="13" font-weight="700">External services (HTTPS)</text>
  <text x="450" y="554" text-anchor="middle" fill="#8b9ac0" font-size="11">LLM endpoint · Search · Source websites</text>

  <!-- arrows -->
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#5b8cff"/>
    </marker>
  </defs>
  <line x1="450" y1="130" x2="450" y2="160" stroke="#5b8cff" marker-end="url(#arr)"/>
  <line x1="380" y1="220" x2="260" y2="260" stroke="#5b8cff" marker-end="url(#arr)"/>
  <line x1="520" y1="220" x2="640" y2="260" stroke="#5b8cff" marker-end="url(#arr)"/>
  <line x1="260" y1="340" x2="260" y2="380" stroke="#5b8cff" marker-end="url(#arr)"/>
  <line x1="640" y1="340" x2="640" y2="380" stroke="#5b8cff" marker-end="url(#arr)"/>
  <line x1="260" y1="450" x2="380" y2="500" stroke="#5b8cff" marker-end="url(#arr)"/>
  <line x1="640" y1="450" x2="520" y2="500" stroke="#5b8cff" marker-end="url(#arr)"/>
</svg>